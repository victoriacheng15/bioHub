<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <meta property="og:title" content="{{.Params.Name}} - BioHub">
  <meta property="og:description" content="{{.Params.Headline}}">
  <meta property="og:image" content="{{.Params.Avatar}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{.Params.Name}} - BioHub">
  <meta name="twitter:description" content="{{.Params.Headline}}">
  <meta name="twitter:image" content="{{.Params.Avatar}}">
  <title>BioHub - {{.Params.Name}}</title>
  <meta name="author" content="{{.Params.Name}}">
  <meta name="description" content="{{.Params.Headline}}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="LLMs Text Version">
  <style>
    :root {
      /* Colors System - Slate */
      --color-slate-300: #cbd5e1;
      --color-slate-500: #64748b;
      --color-slate-900: #0f172a;
      --color-slate-950: #020617;

      /* Colors System - Violet (Accent) */
      --color-violet-400: #a78bfa;
      --color-violet-700: #6d28d9;
      --color-violet-900: #4c1d95;

      /* Semantic Mapping */
      --bg-color: var(--color-slate-950);
      --text-color: var(--color-slate-300);
      --link-bg: var(--color-slate-900);
      --link-text: var(--color-slate-300);
      --link-hover-border: var(--color-violet-400);

      /* Spacing */
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2.5rem;

      /* Borders */
      --radius: 10px;
      --radius-round: 50%;

      /* Typography */
      --font-size-md: 1.25rem;
      --font-size-lg: 1.5rem;
      --font-size-xl: 2.5rem;

      --letter-spacing: 2px;

      /* Asset & Container Sizes */
      --container-width: 600px;
      --avatar-size: 150px;
      --icon-size: 32px;

      /* Transitions */
      --transition: all 300ms ease-in-out;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Open Sans', sans-serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    #app {
      min-height: 100vh;
      width: min(90%, var(--container-width));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-xl);
      padding: var(--spacing-xl) var(--spacing-lg);
    }

    header,
    main,
    footer,
    main ul,
    main li,
    main a {
      width: 100%;
    }

    header,
    .btn,
    .social-links,
    main ul,
    main li,
    main a,
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    header {
      flex-direction: column;
      gap: var(--spacing-lg);
      margin-block: var(--spacing-lg);

      h1 {
        font-size: var(--font-size-xl);
        letter-spacing: var(--letter-spacing);
        color: var(--color-violet-400);
      }

      .avatar {
        border-radius: var(--radius-round);
        width: var(--avatar-size);
        aspect-ratio: 1;
        border: 2px solid var(--color-violet-700);
      }

      p {
        font-size: var(--font-size-md);
        letter-spacing: 1px;
        text-align: center;
        line-height: 1.25;
      }

      ul {
        gap: var(--spacing-lg);
      }
    }

    .social-links .btn {
      background: var(--color-slate-900);
      border: 2px solid transparent;
      padding: var(--spacing-sm);
      border-radius: var(--radius);
      transition: var(--transition);

      &:hover {
        border-color: var(--color-violet-400);
      }

      img {
        width: var(--icon-size);
        aspect-ratio: 1;
        filter: invert(44%) sepia(91%) saturate(1253%) hue-rotate(229deg) brightness(101%) contrast(92%);
      }
    }

    main {
      margin-block: var(--spacing-lg);

      ul {
        flex-direction: column;
        gap: var(--spacing-md);

        li {
          background: var(--link-bg);
          border: 2px solid transparent;
          border-radius: var(--radius);
          transition: var(--transition);
          cursor: pointer;

          &:hover {
            border-color: var(--link-hover-border);
          }

          a {
            padding: var(--spacing-md);
            color: var(--link-text);
            font-size: var(--font-size-lg);
            font-weight: bold;
            letter-spacing: var(--letter-spacing);
          }
        }
      }
    }

    footer {
      margin-top: auto;
      padding-block: var(--spacing-lg);
      border-top: 1px solid var(--color-violet-900);

      p {
        color: var(--color-slate-500);
        font-size: 0.875rem;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <img class="avatar" src="{{.Params.Avatar}}" alt="{{.Params.Name}}'s avatar" loading="lazy" decoding="async" />
      <h1>{{.Params.Name}}</h1>
      <p>{{.Params.Headline}}</p>
      <ul class="social-links">
        {{range .Params.Socials}}
        <li>
          <a class="btn" href="{{.URL}}" target="_blank" rel="noopener noreferrer"
            aria-label="Visit me on {{.Platform}}">
            <img src="{{.Icon}}" alt="{{.Platform}} icon" />
          </a>
        </li>
        {{end}}
      </ul>
    </header>
    <main>
      <ul>
        {{range .Params.Links}}
        <li>
          <a href="{{.URL}}" target="_blank" rel="noopener noreferrer">{{.Name}}</a>
        </li>
        {{end}}
      </ul>
    </main>
    <footer>
      <p>Copyright &copy; <span aria-label="penguin emoji">🐧</span> {{.Params.Name}}</p>
    </footer>
  </div>
</body>

</html>
